{% extends 'base.html' %}
{% block title %}{{ heading }}{% endblock %}

{% block content %}
<h1>{{ heading }}</h1>

<div class="panel narrow">
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <div class="actions">
            <button class="btn" type="submit">Save book</button>
            <a href="{% if book %}{{ book.get_absolute_url }}{% else %}{% url 'book_list' %}{% endif %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
