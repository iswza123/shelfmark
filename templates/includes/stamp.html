{% if loan.is_returned %}<span class="stamp returned">Returned {{ loan.returned_on|date:"d M" }}</span>
{% elif loan.is_overdue %}<span class="stamp overdue">Overdue {{ loan.days_overdue }} day{{ loan.days_overdue|pluralize }}</span>
{% else %}<span class="stamp">Due {{ loan.due_date|date:"d M Y" }}</span>{% endif %}
